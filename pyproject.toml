[project]
name = "arxiv-paper-curator"
version = "0.1.0"
description = "Production-grade RAG system over arXiv papers"
requires-python = ">=3.12"

# Stage 1 keeps dependencies minimal so the foundation installs fast.
# Add per-stage groups below as you progress (uncomment when you reach each stage).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
]

# ── Stage 2 (ingestion + migrations) ────────────────────────────────
# stage2 = ["alembic>=1.13", "tenacity>=8.4", "feedparser>=6.0", "docling>=2.0"]
# ── Stage 3/4 (search + hybrid) ─────────────────────────────────────
# stage3 = ["opensearch-py>=2.6"]
# ── Stage 5 (RAG UI) ────────────────────────────────────────────────
# stage5 = ["gradio>=4.0"]
# ── Stage 6 (observability + cache) ─────────────────────────────────
# stage6 = ["redis>=5.0", "langfuse>=2.0"]
# ── Stage 7 (agentic + telegram) ────────────────────────────────────
# stage7 = ["langgraph>=0.2", "python-telegram-bot>=21.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
